<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EcoMind — Enterprise Energy Analytics Platform</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="Understand building energy usage, detect anomalies, compare buildings, forecast future consumption and produce organisation-ready reports."
    />
    <!--
      Geist is self-hosted, not fetched from a font CDN. This product is used
      on facility networks, where an external font dependency is both a latency
      problem and an availability risk: the interface must not change shape
      because someone else's CDN is slow.

      Variable fonts, so one file covers the whole weight range instead of one
      file per weight. Sans is preloaded because it paints the first screenful;
      Mono is not, because metrics appear after the shell has rendered and
      loading it eagerly would compete with that first paint.
    -->
    <link
      rel="preload"
      href="/fonts/Geist-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
