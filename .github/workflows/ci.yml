name: CI

# Every check that has to pass before a change is considered safe. These are the
# same commands run locally, so a green local run and a green CI run mean the
# same thing -- the most common way CI becomes noise is letting it diverge from
# what developers actually run.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push makes an in-flight run irrelevant. Without this, a five-commit
# branch queues five redundant full builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` not `npm install`: it installs exactly the lockfile, so CI
      # cannot pass against a dependency that was never committed.
      - run: npm ci

      # Typecheck and lint before tests, because they fail fast and a broken
      # type means the test results below are not worth reading.
      - name: Typecheck
        run: ./node_modules/.bin/tsc -b

      - name: Lint
        run: ./node_modules/.bin/eslint .

      - name: Format
        run: ./node_modules/.bin/prettier --check "src/**/*.{ts,tsx,css}"

      - name: Test
        run: ./node_modules/.bin/vitest run

      - name: Build
        run: npm run build

      # Guards the bundle ceiling the roadmap set. Without a hard limit, a
      # convenient `import` can quietly add a hundred kilobytes and nobody
      # notices until users do.
      - name: Check bundle budget
        run: |
          set -euo pipefail
          # Bytes, not kB: Vite reports kB as bytes/1000 while most shell
          # arithmetic divides by 1024, so a kB budget silently drifts from
          # what the build log says. Comparing raw bytes removes the ambiguity.
          budget_bytes=360000      # 360 kB decimal, matching Vite's own unit
          actual=$(ls -S dist/assets/index-*.js | head -1)
          size=$(stat -c%s "$actual")
          echo "entry chunk: $(( size / 1000 )) kB / $size bytes (budget $(( budget_bytes / 1000 )) kB)"
          if [ "$size" -gt "$budget_bytes" ]; then
            echo "::error::Entry chunk $(( size / 1000 )) kB exceeds the $(( budget_bytes / 1000 )) kB budget."
            exit 1
          fi

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      # No test database service: the suite runs against SQLite and creates its
      # own fixtures, so there is nothing external to depend on.
      - name: Test
        run: python -m pytest -q --no-header -p no:cacheprovider

  fresh-clone:
    name: One-click bootstrap (bare checkout)
    runs-on: ubuntu-latest
    # The job that would have caught the passlib break. That one shipped because
    # requirements.txt pinned passlib 1.7.4 while leaving bcrypt unpinned: the
    # working tree survived on a bcrypt 4.0.1 left over from years of history,
    # and every ordinary test run used that same environment. Nothing installed
    # the project from scratch, so nothing noticed that a new clone came up with
    # no admin user and no way to log in.
    #
    # `actions/checkout` is already a bare clone -- .venv, node_modules, .env and
    # the database are all gitignored -- so there is nothing to strip. Running
    # the real launcher here is the point: it exercises the same code path a
    # person who just cloned the repository runs.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Confirm the checkout really is bare
        run: |
          set -euo pipefail
          for p in .venv frontend/node_modules backend/.env backend/data/ecomind.db; do
            if [ -e "$p" ]; then
              echo "::error::Fresh clone should not contain '$p' -- this job is not testing what it claims."
              exit 1
            fi
          done
          echo "bare checkout confirmed"

      # `verify` is start without the long-running part: it creates the
      # virtualenv, installs both dependency sets, generates backend/.env and
      # seeds the database, then exits instead of monitoring forever.
      - name: Run the one-click bootstrap
        run: ./ecomind.sh verify

      - name: Prove the seeded database can actually create a user
        # A green bootstrap is not enough on its own. This is the exact line
        # that used to fail: passlib raised "password cannot be longer than 72
        # bytes" while hashing the admin password, so the seeder died and the
        # app came up unusable.
        run: |
          set -euo pipefail
          ./.venv/bin/python backend/seed.py
          ./.venv/bin/python - <<'PY'
          import sys
          # Must happen before the app imports: the package lives in backend/,
          # not on the path by default when python is invoked from the root.
          sys.path.insert(0, "backend")
          from app.db.base import SessionLocal
          from app.db.models import User
          from app.core.security import verify_password
          db = SessionLocal()
          user = db.query(User).first()
          db.close()
          assert user is not None, "no user was seeded"
          assert verify_password("admin123", user.hashed_password), \
              "the seeded password does not verify against its own hash"
          print("seeded user authenticates correctly")
          PY

  bundle-report:
    name: Bundle sizes
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Largest chunks
        run: ls -lS dist/assets/*.js | head -8 | awk '{printf "%.1f kB  %s\n", $5/1024, $9}'